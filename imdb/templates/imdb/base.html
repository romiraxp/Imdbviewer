{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <link rel="icon" type="image/png" href="{% static 'icon/favicon-96x96.png' %}" sizes="96x96" />
  <link rel="icon" type="image/svg+xml" href="{% static 'icon/favicon.svg' %}" />
  <link rel="shortcut icon" href="{% static 'icon/favicon.ico' %}" />
  <link rel="apple-touch-icon" sizes="180x180" href="{% static 'icon/apple-touch-icon.png' %}" />
  <meta name="apple-mobile-web-app-title" content="IMDBviewer" />
  <link rel="manifest" href="{% static 'icon/site.webmanifest' %}" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Exo+2:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link href="{% static 'css/style.css'%}" rel="stylesheet">
</head>
<body>
    {% block content %}
    {% endblock %}
</body>
<footer class="footer">
    <div class ="container footer__container">
      <div class="footer__logo-legal">
        <div class="footer__logo">
          <img src="{% static 'media\Нильсен.svg' %}" alt="Нильсен">
        </div>
        {% block legal %}
        {% endblock %}
      </div>
    </div>
</footer>
</html>
